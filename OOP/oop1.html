<script>
    class Rectangle {
        constructor(length, width) {
        this.length = length;
        this.width = width;
     Thuộc tính chiều rộng }
    getArea() { return this.length * this.width; }
    getPerimeter() { return (this.length + this.width) * 2; }
    draw(canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#667eea';
        ctx.fillRect(50, 50, this.width, this.length); }
    }

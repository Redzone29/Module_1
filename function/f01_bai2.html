<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form>
    <fieldset>
        <input type="number" id="number">
        <button type="button" onclick="plusOne()">plus 1</button>
    </fieldset>
    <script>
        function plusOne() {
            let num1 = Number(document.getElementById("number").value);
            num2 = num1 + 1;
            document.write(num2);
        }
    </script>
</form>
</body>
</html>

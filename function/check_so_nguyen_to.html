<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prime number</title>
</head>
<body>

<script>
    function isPrime(primeNumber) {
        let count = 0
        for (let i = 1; i <= primeNumber; i++) {
            if(primeNumber % i === 0) {
               count++;
            }
        }if(count === 2){
            let result = document.writeln(primeNumber + " is a prime number.");
        }else{
            let result = document.writeln(primeNumber + " is not a prime number.");
        }
        return result;

    }
    let number = parseInt(prompt("Enter number"));
    result = isPrime(number);
</script>
</body>
</html>

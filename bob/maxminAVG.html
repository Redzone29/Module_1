<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function maxMinAvg(arr) {
        let arrnew =[];
        let max = arr[0];
        let min = arr[0];
        let sum = 0;
        for(let i=0; i<arr.length; i++){
            if(arr[i]>max){
                max = arr[i];
            }
        }
        arrnew.push(max);
        for(let i=0; i<arr.length; i++){
            if(arr[i]<min){
                min = arr[i];
            }
        }
        arrnew.push(min);
        for(let i=0; i<arr.length; i++){
            sum +=i;
        }
        let avg = sum / arr.length;
        arrnew.push(avg);

        return arrnew;
    }
</script>
</body>
</html>

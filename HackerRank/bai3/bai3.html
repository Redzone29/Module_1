<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function sumBigIntArray(arr) {
        let sum = BigInt(0);
        for (let i = 0; i < arr.length; i++) {
          sum += BigInt(arr[i]);
        }
        return sum;
      }
      let n = parseInt(prompt());
      if (isNaN(n) || n <= 0) {
        document.write("Invalid input for the number of elements.");
      }
      let bigIntArray = [];
      for (let i = 0; i < n; i++) {
        bigIntArray.push(prompt());
        if (isNaN(bigIntArray[i])) {
          document.write("Invalid input for BigInt element.");
        }
      }
      document.write(sumBigIntArray(bigIntArray));
    </script>
  </body>
</html>

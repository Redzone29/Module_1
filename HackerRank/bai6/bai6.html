<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function stairCase(n) {
        for (let i = 1; i <= n; i++) {
          let row = "";
          for (let j = 1; j <= n; j++) {
            if (j <= n - i) {
              row += " ";
            } else {
              row += "#";
            }
          }
          console.log(row);
        }
      }
      let n = parseInt(prompt("Enter the number of steps: "));
      stairCase(n);
    </script>
  </body>
</html>

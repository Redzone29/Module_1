<!DOCTYPE html>

  <body>
    <script>
      let arr = [];
      let total = arr.reduce((a, b) => a + b, 0);
      let max = Math.max(...arr);
      let min = Math.min(...arr);
      console.log(total - max, total - min);
    </script>
  </body>

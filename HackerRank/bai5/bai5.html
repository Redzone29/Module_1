<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function plusMinus(arr) {
        let a = 0;
        let b = 0;
        let c = 0;
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] > 0) {
            a++;
          } else if (arr[i] < 0) {
            b++;
          } else {
            c++;
          }
        }
        console.log((a / arr.length).toFixed(6));
        console.log((b / arr.length).toFixed(6));
        console.log((c / arr.length).toFixed(6));
      }
      let n = parseInt(prompt("Enter the number of elements: "));
      let arr = [];
      for (let i = 0; i < n; i++) {
        arr.push(parseInt(prompt(`Enter element ${i + 1}: `)));
      }
      plusMinus(arr);
    </script>
  </body>
</html>

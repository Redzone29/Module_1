<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function sumDiagonalMatrix(array) {
        let sum1 = 0;
        let sum2 = 0;
        let size = array.length;
        for (let i = 0; i < size; i++) {
          sum1 += array[i][i];
          sum2 += array[i][size - 1 - i];
        }
        return Math.abs(sum1 - sum2);
      }
      let n = BigInt(parseInt(prompt("Enter the size of the square matrix: ")));
      let matrix = [];
      for (let i = 0; i < n; i++) {
        matrix[i] = [];
        for (let j = 0; j < n; j++) {
          matrix[i][j] = parseInt(prompt());
        }
      }
      document.write(sumDiagonalMatrix(matrix));
    </script>
  </body>
</html>

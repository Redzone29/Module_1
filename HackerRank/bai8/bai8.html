<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let candles = [];
      let num = parseInt(prompt("Enter the number of candles: "));
      for (let i = 0; i < num; i++) {
        candles.push(
          parseInt(prompt("Enter the height of candle " + (i + 1) + ": "))
        );
      }
      let max = Math.max(...candles);
      let count = 0;

      for (let i = 0; i < candles.length; i++) {
        if (candles[i] === max) {
          count++;
        }
      }

      return count;
    </script>
  </body>
</html>

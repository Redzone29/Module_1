<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let array = [10];
      let max = 0;
      let j = 0;
      for (let i = 0; i < 10; i++) {
        array[i] = parseInt(prompt("type element" + (i + 1) + ":"));
        if (max < array[i]) {
          max = array[i];
          j = i;
        }
      }
      document.write(
        "The largest number is: " +
          max +
          " at position " +
          "array[" +
          (j + 1) +
          "]"
      );
    </script>
  </body>
</html>

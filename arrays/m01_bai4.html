<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let array = [];
      let reversedArray = [];
      let number = parseInt(prompt("Type the number of elements:"));
      for (let i = 0; i < number; i++) {
        array[i] = parseInt(prompt("Type element " + (i + 1) + ":"));
      }
      for (let i = number - 1; i >= 0; i--) {
        reversedArray.push(array[i]);
      }
      document.write("The reversed array is: " + reversedArray);
    </script>
  </body>
</html>

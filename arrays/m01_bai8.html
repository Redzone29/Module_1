<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let array = [];
      for (let i = 0; i < 10; i++) {
        array[i] = parseInt(prompt("type element " + (i + 1) + ":"));
      }
      array.sort(function (a, b) {
        return b - a;
      });
      document.write("The sorted array is: " + array + "<br>");
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      arr = ["a", "b", 3, "d", "e", 5, 6];
      count = 0;
      for (let i = 0; i < 7; i++) {
        if (typeof arr[i] === "number") {
          count++;
        }
      }
      document.write(
        "The number of numeric elements in the array is: " + count
      );
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str = "nguyen gia ruy lop se20c02 dai hoc fpt";
      let arr = str.split(" ");
      let count = 0;
      for (let i = 0; i < arr.length; i++) {
        if (typeof arr[i] === "string") {
          count++;
        }
      }
      document.write(str + "<br>");
      document.write("The number of string elements in the array is: " + count);
    </script>
  </body>
</html>
